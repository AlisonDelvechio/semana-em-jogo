<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8f7f3" />
    <script>
      try {
        const savedTheme = localStorage.getItem('semana-em-jogo-theme')
        const dark =
          savedTheme === 'dark' ||
          (savedTheme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) {
          document.documentElement.dataset.theme = 'dark'
          document.querySelector('meta[name="theme-color"]').content = '#151d19'
        }
      } catch {
        // O navegador pode bloquear armazenamento; o tema claro continua disponível.
      }
    </script>
    <meta
      name="description"
      content="Organize metas de alimentação e treino, um dia de cada vez."
    />
    <title>Semana em Jogo — metas no seu ritmo</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
